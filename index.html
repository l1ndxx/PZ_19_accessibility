<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Доступная библиотека</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <header class="header">
      <div>Библиотека</div>
      <nav><a href="#books">Книги</a><a href="#about">О проекте</a></nav>
    </header>
    <main>
      <section class="hero">
        <img src="./images/book.svg" class="hero__image" alt="" />
        <div>
          <p>Учебная библиотека</p>
          <h1>Книги для самостоятельного обучения</h1>
          <p>
            Проверьте страницу с точки зрения клавиатурной навигации и
            скринридера.
          </p>
          <button type="hero__button">Открыть каталог</button>
      </section>
      <section id="books">
        <h2>Популярные книги</h2>
        <article class="book">
          <img src="./images/book.svg" alt="Обложка книги «Основы веб-разработки»"/>
          <img src="./images/decor.svg" alt=""/>
          <h3>Основы веб-разработки</h3>
          <p>Введение в HTML и CSS.</p>
          <a href="#">Подробнее</a>
        </article>
      </section>
      <section id="about"><h2>О проекте</h2></section>
    </main>
  </body>
</html>
